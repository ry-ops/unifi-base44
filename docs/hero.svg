<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">OmniFi: a dashboard and AI chat for your UniFi network</title>
  <desc id="d">A Base44 app that shows your UniFi network at a glance — clients, devices, WAN uptime, traffic and health — and lets you ask questions in plain language, answered from live network data.</desc>
  <defs><linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#00a2ff"/><stop offset=".5" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#e8eef5; }
    .muted { fill:#8795a8; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes q { 0%,5.00% { opacity:0 } 9.00%,92.00% { opacity:1 } 95.00%,100% { opacity:0 } } .q { animation:q 10.0s infinite; }
    @keyframes a { 0%,38.00% { opacity:0 } 42.00%,92.00% { opacity:1 } 95.00%,100% { opacity:0 } } .a { animation:a 10.0s infinite; }
    @keyframes rise { 0%,2%{opacity:0;transform:translateY(8px)} 10%,100%{opacity:1;transform:translateY(0)} } .rise{animation:rise 10s infinite}
    @keyframes sweep { 0%{stroke-dashoffset:264} 20%,100%{stroke-dashoffset:150} } .donut{animation:sweep 10s infinite}
    @keyframes draw { 0%{stroke-dashoffset:260} 25%,100%{stroke-dashoffset:0} } .draw{stroke-dasharray:260;animation:draw 10s infinite}
    @keyframes gauge { 0%{transform:rotate(-70deg)} 20%,100%{transform:rotate(34deg)} } .needle{transform-origin:275px 250px;animation:gauge 10s infinite}
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; opacity:1 !important; transform:none !important; } .donut{stroke-dashoffset:150} .draw{stroke-dashoffset:0} }
  </style>
  <rect width="960" height="400" rx="20" fill="#0b0f17"/>
  <text x="40" y="54" font-size="30" font-weight="800" style="fill:url(#title)">OmniFi</text>
  <text x="42" y="82" font-size="15" class="muted">See your UniFi network at a glance — and just ask it questions.</text>

  <g class="rise">
  <rect x="40" y="104" width="150" height="64" rx="10" fill="#111a27" stroke="#1e2a3a"/>
  <text x="56" y="126" font-size="10.5" class="muted">CLIENTS ONLINE</text><text x="56" y="152" font-size="22" font-weight="800" style="fill:#22d3ee">147</text>
  <rect x="200" y="104" width="150" height="64" rx="10" fill="#111a27" stroke="#1e2a3a"/>
  <text x="216" y="126" font-size="10.5" class="muted">DEVICES</text><text x="216" y="152" font-size="22" font-weight="800">18</text><text x="250" y="152" font-size="11" style="fill:#5fe08a">all adopted</text>

  <rect x="360" y="104" width="300" height="80" rx="10" fill="#0e1622" stroke="#1e2a3a"/>
  <text x="376" y="124" font-size="10.5" class="muted">WAN THROUGHPUT</text>
  <polyline class="draw" points="372,120.0 392,113.81630196930263 412,110.28062098636687 432,110.90702573174318 452,115.42727373364188 472,121.90567962875485 492,127.56802495307929 512,129.98954917097927 532,128.1332939156758 552,122.79415498198927 572,116.2584876942878 592,111.32503130381194 612,110.10641753376618" fill="none" stroke="#00a2ff" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- donut (BY BAND) center 115,262 -->
  <rect x="40" y="180" width="150" height="150" rx="10" fill="#111a27" stroke="#1e2a3a"/>
  <text x="56" y="202" font-size="10.5" class="muted">BY BAND</text>
  <circle cx="115" cy="262" r="40" fill="none" stroke="#1e2a3a" stroke-width="13"/>
  <circle class="donut" cx="115" cy="262" r="40" fill="none" stroke="#00a2ff" stroke-width="13" stroke-dasharray="264" transform="rotate(-90 115 262)" stroke-linecap="round"/>
  <text x="115" y="267" text-anchor="middle" font-size="15" font-weight="800">5GHz</text>

  <!-- gauge (DEVICE HEALTH) center 275,250 -->
  <rect x="200" y="180" width="150" height="150" rx="10" fill="#111a27" stroke="#1e2a3a"/>
  <text x="216" y="202" font-size="10.5" class="muted">DEVICE HEALTH</text>
  <path d="M235 250 A 40 40 0 0 1 315 250" fill="none" stroke="#1e2a3a" stroke-width="10"/>
  <path d="M235 250 A 40 40 0 0 1 315 250" fill="none" stroke="#5fe08a" stroke-width="10" stroke-dasharray="95 200" stroke-linecap="round"/>
  <line class="needle" x1="275" y1="250" x2="300" y2="236" stroke="#e8eef5" stroke-width="3" stroke-linecap="round"/>
  <circle cx="275" cy="250" r="4" fill="#e8eef5"/>
  <text x="275" y="300" text-anchor="middle" font-size="13" font-weight="800" style="fill:#5fe08a">Healthy</text>

  <rect x="360" y="196" width="300" height="134" rx="10" fill="#0e1622" stroke="#1e2a3a"/>
  <text x="376" y="216" font-size="10.5" class="muted">RECENT EVENTS</text>
  <text x="376" y="240" font-size="11" class="muted">· AP "Garage" reconnected</text>
  <text x="376" y="262" font-size="11" class="muted">· New client on IoT VLAN</text>
  <text x="376" y="284" font-size="11" class="muted">· WAN latency normal (12ms)</text>
  <text x="376" y="306" font-size="11" class="muted">· Firmware up to date</text>
  </g>

  <rect x="680" y="104" width="240" height="226" rx="12" fill="#101826" stroke="#2a3a52"/>
  <text x="700" y="128" font-size="11" font-weight="700" style="fill:#7cc4ff">💬 Ask OmniFi</text>
  <g class="q"><rect x="700" y="140" width="200" height="50" rx="9" fill="#17263a"/><text x="714" y="160" font-size="11">Which AP is most</text><text x="714" y="177" font-size="11">congested right now?</text></g>
  <g class="a"><rect x="700" y="200" width="200" height="110" rx="9" fill="#0e1f1a" stroke="#1f6e4e"/>
    <text x="714" y="222" font-size="11" style="fill:#8fe6a6">“Living Room” — 2.4GHz at</text>
    <text x="714" y="239" font-size="11" style="fill:#8fe6a6">78% channel utilization,</text>
    <text x="714" y="256" font-size="11" style="fill:#8fe6a6">31 clients. Consider moving</text>
    <text x="714" y="273" font-size="11" style="fill:#8fe6a6">some to 5GHz.</text>
    <text x="714" y="297" font-size="9.5" class="muted">from live UniFi data · admin-gated</text></g>
</svg>
